{% extends "base.html" %}
{% block content %}
<h2>Bagi Hasil per Periode</h2>
<p><input id="periode" type="month"></p>
<table id="tbl"><thead><tr><th>Penitip</th><th>% Toko</th><th>Omzet</th><th>Hak Toko</th><th>Hak Penitip</th></tr></thead><tbody></tbody><tfoot></tfoot></table>
{% endblock %}
{% block scripts %}
<script>
el("periode").value = new Date().toISOString().slice(0, 7);
async function show() {
  const d = await api("/api/bagi-hasil?periode=" + el("periode").value);
  el("tbl").querySelector("tbody").innerHTML = d.rincian.map(x =>
    `<tr><td>${x.nama}</td><td>${x.persen_toko}%</td><td>${rupiah(x.omzet)}</td>
     <td>${rupiah(x.hak_toko)}</td><td><b>${rupiah(x.hak_penitip)}</b></td></tr>`).join("");
  el("tbl").querySelector("tfoot").innerHTML = `
    <tr><td colspan="2"><b>Total</b></td><td><b>${rupiah(d.total_omzet)}</b></td>
    <td><b>${rupiah(d.total_hak_toko)}</b></td><td><b>${rupiah(d.total_hak_penitip)}</b></td></tr>`;
}
el("periode").onchange = show;
show();
</script>
{% endblock %}
