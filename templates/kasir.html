{% extends "base.html" %}
{% block content %}
<h2>Kasir Penjualan</h2>
<form id="f">
  <select id="produk"></select>
  <input id="qty" type="number" min="1" value="1">
  <button type="button" onclick="tambah()">+ Keranjang</button>
</form>
<h3>Keranjang</h3>
<table id="cart"><thead><tr><th>Produk</th><th>Qty</th><th>Harga</th><th>Subtotal</th><th></th></tr></thead><tbody></tbody><tfoot></tfoot></table>
<p><input id="catatan" placeholder="Catatan (opsional)"></p>
<button onclick="bayar()">Bayar</button>
<h3>Riwayat Penjualan</h3>
<div id="riwayat"></div>
{% endblock %}
{% block scripts %}
<script>
let katalog = [], cart = [];
async function load() {
  katalog = await api("/api/stok");
  el("produk").innerHTML = katalog.map(x =>
    `<option value="${x.id}">${x.sku} — ${x.nama} · ${rupiah(x.harga_jual)} (stok ${x.stok})</option>`).join("");
  const r = await api("/api/penjualan");
  el("riwayat").innerHTML = r.slice(0, 20).map(j => `
    <div class="card"><b>#${j.id}</b> · ${j.tanggal} · ${rupiah(j.total)}
    <ul>${j.items.map(i => `<li>${i.nama_produk} × ${i.qty} @ ${rupiah(i.harga_satuan)}</li>`).join("")}</ul></div>`).join("");
}
function tambah() {
  const p = katalog.find(x => x.id === +el("produk").value);
  const q = +el("qty").value;
  const ada = cart.find(x => x.produk_id === p.id);
  if (ada) ada.qty += q; else cart.push({produk_id: p.id, nama: p.nama, harga: p.harga_jual, qty: q});
  render();
}
function render() {
  const tb = el("cart");
  const tot = cart.reduce((a, x) => a + x.qty * x.harga, 0);
  tb.querySelector("tbody").innerHTML = cart.map((x, i) =>
    `<tr><td>${x.nama}</td><td>${x.qty}</td><td>${rupiah(x.harga)}</td>
     <td>${rupiah(x.qty * x.harga)}</td>
     <td><button onclick="cart.splice(${i},1);render()">hapus</button></td></tr>`).join("");
  tb.querySelector("tfoot").innerHTML = `<tr><td colspan="3"><b>Total</b></td><td><b>${rupiah(tot)}</b></td><td></td></tr>`;
}
async function bayar() {
  if (!cart.length) return alert("Keranjang kosong");
  const r = await post("/api/penjualan", {items: cart.map(({produk_id, qty}) => ({produk_id, qty})), catatan: el("catatan").value});
  if (r.error) return alert(r.error);
  alert("Terjual! Total " + rupiah(r.total));
  cart = []; render(); load();
}
load();
</script>
{% endblock %}
