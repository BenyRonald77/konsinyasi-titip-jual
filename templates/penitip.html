{% extends "base.html" %}
{% block content %}
<h2>Penitip (UMKM)</h2>
<table id="tbl"><thead><tr><th>Nama</th><th>Kontak</th><th>% Toko</th></tr></thead><tbody></tbody></table>
<h3>Tambah Penitip</h3>
<form id="f">
  <input name="nama" placeholder="Nama UMKM" required>
  <input name="kontak" placeholder="Kontak">
  <input name="persen_toko" type="number" min="0" max="100" step="0.1" value="20" required>
  <button>Simpan</button>
</form>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const p = await api("/api/penitip");
  el("tbl").querySelector("tbody").innerHTML = p.map(x =>
    `<tr><td>${x.nama}</td><td>${x.kontak || "-"}</td><td>${x.persen_toko}%</td></tr>`).join("");
}
el("f").onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  d.persen_toko = +d.persen_toko;
  await post("/api/penitip", d); e.target.reset(); load();
};
load();
</script>
{% endblock %}
